name: Publicar en PyPI

# Se ejecuta al publicar una release en GitHub, o a mano para una etiqueta que ya tiene release
# (Actions > Publicar en PyPI > Run workflow). PyPI confía en este workflow (trusted publishing),
# así que no hace falta guardar ningún token.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: Etiqueta que se publica, por ejemplo v1.1.0
        required: true

env:
  ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ETIQUETA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar que la etiqueta coincide con la versión del paquete
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$ETIQUETA" || { echo "La etiqueta $ETIQUETA no coincide con la versión $version"; exit 1; }
      - name: Ejecutar los tests
        run: |
          python -m pip install ".[dev]"
          python -m pytest -q
      - name: Construir el paquete
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyplAI/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
