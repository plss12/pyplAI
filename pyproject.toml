[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyplAI"
version = "1.1.0"
description = "Biblioteca para Python con algoritmos de resolución de juegos de mesa (Minimax, MCTS, SO-ISMCTS y MO-ISMCTS)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Pedro Luis Soto Santos", email = "pepoluis712@gmail.com" }]
keywords = [
    "python", "artificial intelligence", "AI", "games", "board games", "minimax", "alpha-beta",
    "monte carlo", "monte carlo tree search", "UCT", "game theory", "information set",
    "perfect information", "imperfect information",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "colorama>=0.4"]

[project.urls]
Homepage = "https://github.com/plss12/pyplAI"
Changelog = "https://github.com/plss12/pyplAI/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["pyplAI"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["experimentos"]
